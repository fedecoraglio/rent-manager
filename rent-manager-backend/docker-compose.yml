services:
  mysql:
    image: mysql:8.0
    container_name: rent-manager-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: rent-manager-db
      MYSQL_USER: rent_manager
      MYSQL_PASSWORD: rent_manager_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data: