name: Release Images

on:
  push:
    tags:
      - 'v[0-9]*'

concurrency:
  group: rent-manager-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Use a release tag such as v1.0.0.' >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/develop

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./rent-manager-backend
          file: ./rent-manager-backend/Dockerfile
          push: true
          tags: ghcr.io/fedecoraglio/rent-manager-backend:${{ env.RELEASE_TAG }}

      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./rent-manager-frontend
          file: ./rent-manager-frontend/Dockerfile
          push: true
          tags: ghcr.io/fedecoraglio/rent-manager-frontend:${{ env.RELEASE_TAG }}

      - name: Checkout deployment branch
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Update deployment images
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          for component in ('backend', 'frontend'):
              path = Path(f'platform/kubernetes/{component}/deployment.yaml')
              image = f'ghcr.io/fedecoraglio/rent-manager-{component}'
              digest = os.environ[f'{component.upper()}_DIGEST']
              if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
                  raise SystemExit(f'Invalid image digest for {component}')
              reference = f'{image}:{os.environ["RELEASE_TAG"]}@{digest}'
              content, count = re.subn(
                  rf'(?m)^(\s*image:\s*){re.escape(image)}:[^\s]+',
                  lambda match: match[1] + reference,
                  path.read_text(),
              )
              if count != 1:
                  raise SystemExit(f'Expected one image reference in {path}')
              path.write_text(content)
          PY

      - name: Commit deployment version
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform/kubernetes/backend/deployment.yaml platform/kubernetes/frontend/deployment.yaml
          if git diff --cached --quiet; then
            echo 'This release is already configured.'
            exit 0
          fi
          git commit -m "Deploy release $RELEASE_TAG"
          git pull --rebase origin develop
          git push origin HEAD:develop
