apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: rent-manager
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/fedecoraglio/rent-manager.git
    targetRevision: develop
    path: platform/kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: rent-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true