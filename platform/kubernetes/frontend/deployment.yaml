apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: rent-manager

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: ghcr.io/fedecoraglio/rent-manager-frontend:1.0.0@sha256:ca56d5447793c0fcb63f9c01d30d417a8c9fc68819a14ad23f61669881492b45
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          volumeMounts:
            - name: frontend-config
              mountPath: /usr/share/nginx/html/assets/config.json
              subPath: config.json

      volumes:
        - name: frontend-config
          configMap:
            name: frontend-config