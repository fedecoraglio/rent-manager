apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: rent-manager
  namespace: rent-manager
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "21m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "480"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "480"

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
