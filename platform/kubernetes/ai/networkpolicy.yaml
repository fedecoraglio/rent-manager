apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-from-backend
  namespace: rent-manager
spec:
  podSelector:
    matchLabels:
      app: ai
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 8081
