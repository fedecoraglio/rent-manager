apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-config
  namespace: rent-manager
data:
  SERVER_PORT: "8081"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  OLLAMA_BASE_URL: "http://ollama:11434"
  DOCUMENT_STORAGE_PATH: "/app/storage"
  INDEXING_TIMEOUT_SECONDS: "300"
  OLLAMA_EMBEDDING_READ_TIMEOUT_SECONDS: "120"
  OLLAMA_CHAT_READ_TIMEOUT_SECONDS: "300"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
