apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  namespace: rent-manager
spec:
  replicas: 1
  # Filesystem storage is single-writer; avoid overlapping old/new instances.
  strategy:
    type: Recreate
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: wait-for-postgres
          image: pgvector/pgvector:0.8.2-pg17
          envFrom:
            - configMapRef:
                name: postgres-config
            - secretRef:
                name: postgres-secret
          command: ["/bin/sh", "-ec"]
          args:
            - |
              export PGPASSWORD="$POSTGRES_PASSWORD"
              until psql -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c 'SELECT 1' >/dev/null 2>&1; do
                echo "Waiting for PostgreSQL credentials and database"
                sleep 5
              done
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
        - name: wait-for-models
          image: ollama/ollama:0.12.3
          envFrom:
            - configMapRef:
                name: ollama-config
          env:
            - name: OLLAMA_HOST
              value: "http://ollama:11434"
            - name: HOME
              value: "/tmp"
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until ollama show "$EMBEDDING_MODEL" >/dev/null 2>&1 && ollama show "$CHAT_MODEL" >/dev/null 2>&1; do
                echo "Waiting for Ollama and required models"
                sleep 5
              done
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      containers:
        - name: ai
          image: ghcr.io/fedecoraglio/rent-manager-ai:master
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: postgres-config
            - configMapRef:
                name: ai-config
            - secretRef:
                name: postgres-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: documents
              mountPath: /app/storage
      volumes:
        - name: documents
          persistentVolumeClaim:
            claimName: ai-documents
