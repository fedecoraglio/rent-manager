apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: rent-manager

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: ghcr.io/fedecoraglio/rent-manager-backend:1.0.0@sha256:eacf3620897c6fe45705e0a983b5197972ac60c89d55df9d15607837ee0bcf6b
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: backend-config

            - secretRef:
                name: backend-secret