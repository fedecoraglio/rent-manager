apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: rent-manager

data:
  APP_ENV: "production"
  APP_NAME: "rent-manager-backend"

  HTTP_URL: "0.0.0.0"
  HTTP_PORT: "8080"
  HTTP_ALLOWED_ORIGINS: "*"
  AI_BASE_URL: "http://ai:8081"
  AI_TIMEOUT_SECONDS: "450"

  DB_CONNECTION: "mysql"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_NAME: "rent_manager"
  DB_USER: "rent_manager"
