apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: rent-manager

data:
  APP_ENV: "production"
  APP_NAME: "rent-manager-backend"

  HTTP_URL: "0.0.0.0"
  HTTP_PORT: "8080"
  HTTP_ALLOWED_ORIGINS: "*"

  DB_CONNECTION: "mysql"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_NAME: "rent_manager"
  DB_USER: "rent_manager"