@if (notificationService.notificationSignal(); as notification) {
  <div
    class="mx-5 mt-4 flex items-start justify-between gap-4 rounded-2xl border px-4 py-3 text-sm font-medium shadow-sm lg:mx-8"
    [class.border-red-200]="notification.type === 'error'"
    [class.bg-red-50]="notification.type === 'error'"
    [class.text-red-700]="notification.type === 'error'"
    [class.border-green-200]="notification.type === 'success'"
    [class.bg-green-50]="notification.type === 'success'"
    [class.text-green-700]="notification.type === 'success'"
    [class.border-slate-200]="notification.type === 'info'"
    [class.bg-white]="notification.type === 'info'"
    [class.text-slate-700]="notification.type === 'info'"
  >
    <div class="flex items-start gap-3">
      <mat-icon>
        @if (notification.type === 'error') {
          error
        } @else if (notification.type === 'success') {
          check_circle
        } @else {
          info
        }
      </mat-icon>

      <span>{{ notification.message }}</span>
    </div>

    <button
      class="text-current opacity-70 transition hover:opacity-100"
      type="button"
      aria-label="Cerrar mensaje"
      (click)="notificationService.clear()"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>
}
