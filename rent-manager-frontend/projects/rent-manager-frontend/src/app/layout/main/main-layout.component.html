<div class="min-h-screen bg-slate-100 text-slate-950">
  <aside
    class="fixed inset-y-0 left-0 hidden w-64 border-r border-slate-200 bg-white p-5 lg:flex lg:flex-col"
  >
    <div class="mb-8">
      <p class="text-xs font-semibold uppercase tracking-[0.25em] text-slate-400">
        {{ 'app.name' | translate }}
      </p>
      <h1 class="mt-2 text-2xl font-extrabold tracking-tight">{{ 'app.subtitle' | translate }}</h1>
    </div>

    <nav class="flex flex-col gap-2">
      @for (item of menuItems; track item.route) {
        <a
          class="flex items-center gap-3 rounded-2xl px-4 py-3 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 hover:text-slate-950"
          [routerLink]="item.route"
          routerLinkActive="bg-slate-950 text-white hover:bg-slate-950 hover:text-white"
        >
          <mat-icon class="!text-xl">{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
    <div class="mt-auto pt-4 border-t border-slate-200">
      <button mat-button type="button" (click)="logout()">
        <mat-icon>logout</mat-icon>
        {{ 'menu.logout' | translate }}
      </button>
    </div>
  </aside>

  <div class="lg:pl-64">
    @if (loadingService.isLoading()) {
      <mat-progress-bar mode="indeterminate" />
    }
    <nav class="flex gap-2 overflow-x-auto border-b border-slate-200 bg-white px-4 py-3 lg:hidden">
      @for (item of menuItems; track item.route) {
        <a
          class="flex items-center gap-2 rounded-full px-4 py-2 text-sm font-semibold text-slate-600"
          [routerLink]="item.route"
          routerLinkActive="bg-slate-950 text-white"
        >
          <mat-icon class="!text-lg">{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <rm-app-notification />

    <main class="p-5 lg:p-8">
      <router-outlet />
    </main>
  </div>
</div>
